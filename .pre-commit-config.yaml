repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=15000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.11
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Keep in step with the mypy pinned in pyproject.toml. v1.8.0 predates
    # numpy 2.x typing and cannot resolve npt.NDArray[np.float64] at all, which
    # produced ~100 phantom errors in the color pipeline.
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies:
          [
            types-requests,
            types-beautifulsoup4,
            types-PyYAML,
            pandas,
            pytest,
            numpy,
          ]
